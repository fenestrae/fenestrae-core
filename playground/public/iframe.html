<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Playground iframe</title>
    <style>
      body { font-family: sans-serif; margin: 16px; color: #111; }
      code { background: #f3f4f6; padding: 2px 6px; }
    </style>
  </head>
  <body>
    <h1>iframe same-origin</h1>
    <p>Esta página vive en el playground para probar <code>params.url</code>.</p>
    <p id="bridge">Bridge: pendiente</p>
    <script>
      const el = document.getElementById("bridge");
      const tick = () => {
        if (window.fenestrae) {
          el.textContent = "Bridge: winId " + window.fenestrae.winId;
        }
      };
      tick();
      setInterval(tick, 250);
    </script>
  </body>
</html>
